server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Native-federation remote: the hugmesh.systems host fetches
    # remoteEntry.json + the shared/exposed chunks cross-origin, so allow CORS
    # on every bundle this remote serves.
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
