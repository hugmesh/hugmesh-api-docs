# Per-response CSP nonce source. nginx has no built-in random, so we reuse
# $request_id (a 32-hex-char value generated fresh for every request) as the
# nonce. Defined at http scope — this file is copied to
# /etc/nginx/conf.d/default.conf by the Dockerfile, i.e. it is included INSIDE
# the http block, so a bare `map` at file top is legal — and both the sub_filter
# rewrite and the CSP header below reference the SAME per-response value.
map $request_id $cspnonce {
    default $request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + native-federation remote. Emitted with
    # `always` so they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection. DENY (consistent with the
    #     CSP frame-ancestors 'none' below) — this remote is loaded by the host
    #     shell via <script> (native federation), NOT via <iframe>, so no framing
    #     is ever required.
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Native-federation remote: the hugmesh.systems host fetches
    # remoteEntry.json + the shared/exposed chunks cross-origin, so allow CORS
    # on every bundle this remote serves.
    #
    # Content-Security-Policy (strong, nonce-based XSS backstop). WITHOUT a CSP
    # here the TLS front door's blanket fallback (`script-src 'self'`) applies and
    # blocks index.html's INLINE `<script type="esms-options">` tag, so
    # es-module-shims is never configured, the `type="module-shim"` main bundle
    # never executes and Angular never bootstraps — a silently BLANK page. There
    # is NO 'unsafe-inline' / 'unsafe-hashes' in script-src, only the per-response
    # nonce: the sub_filter below rewrites every '<script' in index.html to carry
    # nonce="$cspnonce", and es-module-shims (2.8.1) auto-propagates that nonce to
    # the module scripts it injects, so native federation keeps working.
    #
    # TUNED to what THIS UI's source actually needs (an OpenAPI spec browser:
    # docs-shell + api-reference + api-explorer). Verified against src/**:
    #   - script-src 'self' 'nonce-$cspnonce' blob: : only nonce'd same-origin
    #                                                 scripts run; blob: is
    #                                                 REQUIRED because
    #                                                 es-module-shims instantiates
    #                                                 the rewritten ES modules as
    #                                                 blob: URLs. NO
    #                                                 'wasm-unsafe-eval' — this UI
    #                                                 renders the specs with plain
    #                                                 Angular templates; there is
    #                                                 no WebAssembly / .wasm / eval
    #                                                 in src/** or in its deps (no
    #                                                 Swagger-UI / Scalar / Redoc
    #                                                 bundle is used).
    #   - style-src 'self' 'unsafe-inline'         : Angular injects component
    #                                                 styles as runtime <style>
    #                                                 elements and they are NOT
    #                                                 nonce-able, so
    #                                                 'unsafe-inline' is REQUIRED.
    #                                                 No blob: — nothing here loads
    #                                                 a stylesheet from a blob.
    #   - img-src 'self' data:                     : the templates carry no <img>/
    #                                                 <svg>; 'self' covers the
    #                                                 favicon probe, data: covers
    #                                                 any build-inlined icon. No
    #                                                 remote https: images.
    #   - font-src 'self'                          : styles/_tokens.scss uses the
    #                                                 system stack (Arial /
    #                                                 Helvetica) only — no
    #                                                 @font-face, no data: fonts.
    #   - connect-src 'self'                       : every request this app makes
    #                                                 is SAME-ORIGIN and relative —
    #                                                 HttpClient GETs of
    #                                                 /assets/specs/openapi-*.json
    #                                                 and the live /bff/*, /api/*,
    #                                                 /actions/* spec fallbacks
    #                                                 (docs-shell/specs.ts), plus
    #                                                 ApiExplorer's try-it-out
    #                                                 fetch(), whose buildUrl()
    #                                                 returns the spec's relative
    #                                                 path + query and never an
    #                                                 absolute `servers` URL. The
    #                                                 SSE terminal is a streaming
    #                                                 fetch() (ReadableStream), not
    #                                                 EventSource, and is
    #                                                 same-origin too; there is no
    #                                                 WebSocket (rxjs/webSocket is
    #                                                 in the federation skip list
    #                                                 and never imported), hence no
    #                                                 wss:.
    #   - worker-src 'none'                        : no Worker / SharedWorker /
    #                                                 service worker anywhere in
    #                                                 src/**, and es-module-shims
    #                                                 spawns none.
    #   - media-src is omitted deliberately        : no <video>/<audio>/HLS.
    #   - frame-src 'none'                         : this app embeds no iframes.
    #   - base-uri 'self'                          : stop <base> tag hijacking.
    #   - object-src 'none'                        : block <object>/<embed>.
    #   - frame-ancestors 'none'                   : no framing (mirrors XFO DENY).
    # NOTE: nginx add_header does NOT merge across blocks — a child block with any
    # add_header discards inherited ones — so the CSP + security headers are set
    # here, in the block that actually serves index.html (where XSS would run).
    location / {
        # Inject the per-response nonce into every <script> tag of index.html.
        #   - sub_filter_once off : index.html has multiple <script> tags (the
        #                           inline esms-options block, es-module-shims,
        #                           polyfills and the module-shim main bundle).
        #   - sub_filter_types text/html : ONLY rewrite HTML; the JS/CSS bundles
        #                                  and the assets/specs/*.json payloads are
        #                                  left byte-for-byte untouched.
        # Do NOT enable gzip_static / precompressed index.html — sub_filter cannot
        # rewrite an already-compressed response body, which would leave the
        # <script> tags un-nonced and silently reintroduce the blank page.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';

        # nginx add_header inheritance: a location with its OWN add_header drops
        # all server-scope add_headers, so the security set is repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data:; font-src 'self'; connect-src 'self' blob:; worker-src 'none'; frame-src 'none'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 'ok';
        # nginx add_header inheritance: a location with its OWN add_header drops
        # all server-scope add_headers, so the security set is repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Type text/plain;
    }
}
