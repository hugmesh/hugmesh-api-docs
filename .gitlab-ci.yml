# HugMesh CI — build + push this service's container image to the in-cluster
# GitLab container registry. The GitHub repo is pull-mirrored into in-cluster
# GitLab (mirror_trigger_builds=true), so this runs on push / mirror-sync on the
# privileged x86 runner (shell executor with docker, matching the generator CI).
# Images carry NO keys — KEYS material is supplied from the USB at first boot.

# Centralized OWASP pen-test stage (SCA + authenticated ZAP DAST baseline) pulled
# from the generator. ONE source of truth: onboarded repos get the full harness
# (Dependency-Check SCA + ZAP baseline + custom probes + nuclei) by extending the
# hidden .pentest-* jobs below, rather than each keeping a copy that drifts.
# See memory hugmesh-pentest-standard / hugmesh-dast-inert.
include:
  - project: 'hugmesh/hugmesh-generator'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

stages: [lint, build, pentest]

# -----------------------------------------------------------------------------
# lint:ci-wiring — the guard that keeps the stage below from going quietly inert.
#
# The pen-test stage is allow_failure by policy, so nothing in the pipeline view
# distinguishes "DAST ran and found nothing" from "DAST could not run at all".
# This job asserts the wiring in THIS file is structurally capable of scanning
# (harness reachable at PENTEST_HARNESS_DIR, base before_script not silently
# replaced, allow_failure still present) and then mutation-tests that guard
# against deliberately-broken copies, so a green tick here means the checks can
# actually fail. Pure bash — no image, no Docker, no network.
# -----------------------------------------------------------------------------
lint:ci-wiring:
  stage: lint
  needs: []
  tags: [hugmesh-x86]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
  script:
    - bash scripts/check-ci-wiring.test.sh

build:image:
  stage: build
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

# -----------------------------------------------------------------------------
# OWASP pen-test stage — thin jobs extending the centralized hidden .pentest-*
# jobs from the generator (included above). Rules mirror the org's other onboarded
# repos: merge requests + the default branch.
#
# allow_failure: true is DELIBERATE POLICY, not an oversight — a finding (or a
# flaky env-test-build stand-up) must never red an onboarded repo's pipeline; the
# findings land in the archived out/pentest scorecard + SARIF for triage. Do not
# "fix" it. An ABSENT scan, on the other hand, is not a finding, which is why the
# harness below is fetched rather than assumed, and why lint:ci-wiring exists.
# -----------------------------------------------------------------------------

# SCA — OWASP Dependency-Check over this repo's own manifests (package.json /
# package-lock.json), self-checkout, --failOnCVSS 7. Nothing to fetch: the thing
# being scanned is the repo the job already has.
pentest:sca:
  extends: .pentest-sca
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# DAST — authenticated ZAP baseline (passiveScan + spider + the custom probes +
# the committed nuclei boundary templates) via the shared harness.
#
# HARNESS: FETCHED AT CI TIME, NOT VENDORED. run-pentest.sh executes from the
# INCLUDING repo's checkout (PENTEST_HARNESS_DIR, default `tests/pentest`), which
# this Angular remote does not have — inheriting the template alone would give a
# `pentest:dast` entry that dies having scanned nothing. Of the two fixes, FETCH
# beats vendor here: the harness is a 36-file / ~330 KB tree whose only consumer
# is CI; the `include:` above already pins the template to the generator's `main`,
# so cloning that same ref keeps template and harness in lockstep by construction;
# and the one repo in the org that vendored a copy (hugmesh-games) drifted from
# upstream and kept the silent-skip defects after they were fixed at the source.
# Measured cost of the choice: ~23 MiB transferred, ~110 MiB checked out per DAST
# run, over the in-cluster LAN. (A sparse checkout of tests/pentest/ would cut
# that to a rounding error but adds a git-version floor on the runner; worth doing
# once the runner's git is known.)
#
# The clone is PREPENDED to the base's before_script via !reference, never in
# place of it: `extends:` REPLACES arrays, so a bare `before_script:` override
# (the shape used in hugmesh-admin-ui) silently drops the base's pinned-nuclei
# install — leaving `run-pentest.sh --nuclei` to self-skip — along with its
# missing-harness FATAL. Order matters: fetch first, so the base's harness
# assertion runs against the fetched tree and still fails readably if the
# generator ever moves it.
pentest:dast:
  extends: .pentest-dast-baseline
  allow_failure: true
  variables:
    PENTEST_HARNESS_DIR: "${CI_PROJECT_DIR}/.pentest-harness/tests/pentest"
  before_script:
    - rm -rf "${CI_PROJECT_DIR}/.pentest-harness"
    # Same recipe the generator uses for its own sibling clones: the org base is
    # derived from CI_REPOSITORY_URL, which already carries the read-only CI job
    # token, so no credential is committed and none needs configuring.
    - ORG_BASE="$(dirname "${CI_REPOSITORY_URL}")"
    - git clone --depth 1 --branch main "${ORG_BASE}/hugmesh-generator.git" "${CI_PROJECT_DIR}/.pentest-harness"
    - !reference [.pentest-dast-base, before_script]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
