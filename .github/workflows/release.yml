# Release: builds and pushes the api-docs container image to GHCR.
#
# Mirrors the GitLab CI container build. What each trigger publishes:
#
#   push to main                 -> :main and :sha-<12>. No version tag, no GitHub Release.
#   push of tag v<version>       -> :<version>, :beta (prereleases only) and :sha-<12>,
#                                   plus a GitHub Release marked prerelease, not latest.
#   workflow_dispatch on main    -> same as a push to main.
#   workflow_dispatch on a v tag -> re-runs that release. An image tag that already
#                                   exists is never overwritten: the image step is
#                                   skipped and only a missing GitHub Release is created.
#   anything else                -> refused by scripts/release-version.sh.
#
# The tag is the publish decision: it must equal package.json `.version` (and
# package-lock.json), and the tagged commit must be on main. `:latest` is never
# pushed for a beta.
#
# This workflow has no pull_request trigger and must never gain one. The runs-on
# line sends a job to vars.RUNS_ON_PUBLISH (the self-hosted runner, a JSON array
# such as ["self-hosted","Linux","X64"]) only for a non-PR run on main or a v* tag;
# every other run, and every run when RUNS_ON_PUBLISH is unset, goes to hosted
# ubuntu-latest. Deleting RUNS_ON_PUBLISH in this repo is the off switch. The
# expression is not a security boundary against fork PRs (a fork's PR runs the
# fork's copy of the workflow); the runner group settings are.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hugmesh/hugmesh-api-docs

jobs:
  version:
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.guard.outputs.version }}
      kind: ${{ steps.guard.outputs.kind }}
      prerelease: ${{ steps.guard.outputs.prerelease }}
      channel: ${{ steps.guard.outputs.channel }}
      sha12: ${{ steps.sha.outputs.sha12 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version guard
        id: guard
        run: bash scripts/release-version.sh

      - name: Tagged commit must be on main
        if: steps.guard.outputs.kind == 'release'
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi

      - name: Short SHA
        id: sha
        run: echo "sha12=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

  image:
    needs: version
    # Signed publish job: always a GitHub-hosted runner. Nothing built on a
    # self-hosted runner (the operator's own host) may be published, so this
    # job deliberately does not use RUNS_ON_PUBLISH.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KIND: ${{ needs.version.outputs.kind }}
      CHANNEL: ${{ needs.version.outputs.channel }}
      SHA12: ${{ needs.version.outputs.sha12 }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          set -euo pipefail
          image="$REGISTRY/$IMAGE_NAME"
          skip=false
          if [ "$KIND" = release ]; then
            # A published version tag is immutable: never push over it.
            if docker buildx imagetools inspect "$image:$VERSION" >/dev/null 2>&1; then
              if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                echo "::notice::$image:$VERSION already exists; this re-run skips the image and only completes the release"
                skip=true
              else
                echo "::error::$image:$VERSION already exists; a published version is never overwritten. Raise the beta number instead."
                exit 1
              fi
            fi
            tags="$image:$VERSION"
            if [ -n "$CHANNEL" ]; then
              tags="$tags,$image:$CHANNEL"
            fi
            tags="$tags,$image:sha-$SHA12"
            label_version="$VERSION"
          else
            tags="$image:main,$image:sha-$SHA12"
            label_version="main"
          fi
          {
            echo "skip=$skip"
            echo "tags=$tags"
            echo "label_version=$label_version"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        if: steps.tags.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.label_version }}
            org.opencontainers.image.revision=${{ github.sha }}

      # --- signed-images-20261021 ---
      # Everything below signs what the step `build` just pushed, by DIGEST, from
      # this GitHub-hosted job: a cosign keyless signature (Sigstore, GitHub OIDC),
      # a SLSA build-provenance attestation and an SPDX SBOM attestation, both
      # pushed next to the image. A run that skipped the build (existing release
      # tag) skips all of it.
      - name: Resolve the pushed image name and digest
        id: signref
        if: steps.build.outcome == 'success'
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          meta = json.loads(os.environ.get("METADATA") or "{}")
          digest = os.environ.get("DIGEST", "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              sys.exit(f"::error::build step gave no usable digest: {digest!r}")
          names = [n.strip() for n in meta.get("image.name", "").split(",") if n.strip()]
          repos, tags = set(), []
          for n in names:
              head, _, last = n.rpartition("/")
              if ":" in last:
                  last, tag = last.split(":", 1)
                  tags.append(tag)
              repos.add(f"{head}/{last}")
          if len(repos) != 1:
              sys.exit(f"::error::expected one pushed repository, got {sorted(repos)}")
          if "latest" in tags:
              sys.exit("::error::a :latest tag was pushed; beta images must never be tagged latest")
          repo = repos.pop()
          if repo != repo.lower() or not repo.startswith("ghcr.io/hugmesh/"):
              sys.exit(f"::error::unexpected image repository {repo!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"repo={repo}\ndigest={digest}\n")
          print(f"signing {repo}@{digest} (tags: {', '.join(tags)})")
          PY

      - name: Install cosign
        if: steps.signref.outcome == 'success'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image digest (cosign keyless, GitHub OIDC)
        if: steps.signref.outcome == 'success'
        env:
          REF: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Attest build provenance (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          push-to-registry: true

      - name: Generate an SPDX SBOM of the pushed digest
        if: steps.signref.outcome == 'success'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      - name: Write the verify commands to the job summary
        if: steps.signref.outcome == 'success'
        env:
          REPO_IMAGE: ${{ steps.signref.outputs.repo }}
          DIGEST: ${{ steps.signref.outputs.digest }}
        run: |
          {
            echo "### Signed image"
            echo '```'
            echo "$REPO_IMAGE@$DIGEST"
            echo "cosign verify $REPO_IMAGE@$DIGEST --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/(heads/main|tags/v.*)\$'"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY --predicate-type https://spdx.dev/Document/v2.3"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [version, image]
    if: needs.version.outputs.kind == 'release'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - name: Create GitHub Release
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::release $GITHUB_REF_NAME already exists; nothing to do"
            exit 0
          fi
          flags=(--verify-tag --title "$GITHUB_REF_NAME"
            --notes "Container image: ghcr.io/$IMAGE_NAME:$VERSION")
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"

  # --- signed-images-20261021 ---
  # After the GitHub Release of a v<version> tag run, ask hugmesh.github.io to
  # rebuild its downloads data (contract: .wf-scripts results downloads/
  # DISPATCH-CONTRACT.md). The payload is informational; the site re-reads
  # GitHub itself. Needs the SITE_DISPATCH_TOKEN secret (a token allowed to
  # write contents on hugmesh/hugmesh.github.io); without it this job prints a
  # notice and succeeds. Never runs on a push to main.
  notify-site:
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify hugmesh.github.io (repository_dispatch releases-updated)
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_DISPATCH_TOKEN:-}" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; skipping the hugmesh.github.io releases-updated notification"
            exit 0
          fi
          payload=$(python3 -c 'import json, os; print(json.dumps({"event_type": "releases-updated", "client_payload": {"source": os.environ["GITHUB_REPOSITORY"], "kind": "image", "version": os.environ["GITHUB_REF_NAME"][1:], "ref": os.environ["GITHUB_REF"], "sha": os.environ["GITHUB_SHA"]}}))')
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hugmesh/hugmesh.github.io/dispatches \
            -d "$payload"
          echo "sent releases-updated for $GITHUB_REPOSITORY $GITHUB_REF_NAME"
